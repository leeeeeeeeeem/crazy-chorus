[package]
name = "crazy-chorus"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "crazy-chorus-standalone"
path = "src/main.rs"
required-features = ["standalone"]

# Scaffolded default: CLAP + VST3 + standalone. To add LV2 / AU / AAX / VST2,
# add the matching feature + optional dep below (e.g.
# `lv2 = ["dep:truce-lv2"]` +
# `truce-lv2 = { version = "6.3", optional = true }`).
# Each format feature gates the matching wrapper crate as an optional
# dep.
[features]
default = ["clap", "vst3", "au", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
# Flags any allocation your DSP makes on the audio thread in `process`.
# Dev/test only: `cargo test --features rt-paranoid`. Off, zero-cost by
# default.
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
# Slint editor backend. `slint` must match the exact version truce-slint
# pins: the code generated from `ui/main.slint` refers to the `slint` crate.
truce-slint = { version = "6.3" }
slint = { version = "=1.15.1", default-features = false, features = ["compat-1-2", "renderer-software", "std"] }
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

# Custom profile for `cargo truce install --shell`. The shell-mode
# build (`cargo build --profile shell --features ...,shell`) lands the
# shell binary at `target/shell/lib<crate>.dylib`, independent of
# `target/release/` (where regular `cargo build --release` writes) and
# `target/debug/` (where `cargo build` writes). Inherits release for
# DSP perf parity.
[profile.shell]
inherits = "release"

[dev-dependencies]
truce-test = "6.3"

[build-dependencies]
# Compiles `ui/main.slint` and bundles truce's widget library + JetBrains Mono.
truce-slint-build = "6.3"

# Patched truce-slint: keeps a knob drag alive when the cursor leaves the
# editor window (upstream cancels it on `CursorLeft`). Changes are marked
# "crazy-chorus patch" in vendor/truce-slint/src/editor.rs. Remove this once
# upstream handles it; re-apply after upgrading truce.
[patch.crates-io]
truce-slint = { path = "vendor/truce-slint" }
